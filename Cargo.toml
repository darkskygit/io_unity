[package]
authors      = ["gameltb <gamegccltb@gmail.com>", "DarkSky <darksky2048@gmail.com>"]
description  = "A library for reading Unity assets"
edition      = "2024"
homepage     = "https://github.com/darkskygit/io_unity_next"
keywords     = ["unity"]
license      = "MIT OR Apache-2.0"
name         = "io_unity_next"
readme       = "README.md"
repository   = "https://github.com/darkskygit/io_unity_next"
rust-version = "1.85"
version      = "0.1.0"

[dependencies]
astc-decode = { version = "0.3.1", optional = true }
binrw = "0.15.1"
crc = { version = "3.4.0", optional = true }
glam = "0.33.2"
half = { version = "2.7.1", optional = true }
image = { version = "0.25.9", default-features = false, features = [
  "png",
], optional = true }
lz4 = "1.28.1"
modular-bitfield = "0.13.1"
num_enum = "0.7.6"
once_cell = "1.21.4"
ordered-float = { version = "5.3.0", optional = true }
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
tar = { version = "0.4.46", optional = true }
texpresso = { version = "2.0.2", optional = true }
texture2ddecoder = { version = "0.1.2", optional = true }
thiserror = "2.0.18"
walkdir = "2.5.0"
zstd = { version = "0.13.3", optional = true }

[features]
all = [
  "type-tree-json",
  "external-class-handle",
  "external-class-handle-texture2d",
]
default = []
external-class-handle = ["dep:crc", "dep:half", "dep:ordered-float"]
external-class-handle-texture2d = [
  "dep:astc-decode",
  "dep:image",
  "dep:texpresso",
  "dep:texture2ddecoder",
]
type-tree-json = ["dep:serde", "dep:serde_json", "dep:tar", "dep:zstd"]

[dev-dependencies]
anyhow = "1.0.103"
clap   = { version = "4.6.1", features = ["derive"] }

[[example]]
name              = "fsdump"
required-features = ["all"]

[[example]]
name              = "live2dextractor"
required-features = ["all"]
